const NUMEROS = [{"n":"4","lat":19.043681,"lng":-96.990888},{"n":"7","lat":19.051267,"lng":-96.975911},{"n":"1","lat":19.052748,"lng":-96.99224},{"n":"8","lat":19.045669,"lng":-96.979344},{"n":"5","lat":19.047515,"lng":-96.98561},{"n":"3","lat":19.049543,"lng":-96.987927},{"n":"2","lat":19.054249,"lng":-96.984236},{"n":"6","lat":19.049178,"lng":-96.98164}];
const LUGARES = [{"k":"Iglesia","lat":19.051546,"lng":-96.983593},{"k":"Cancha","lat":19.054303,"lng":-96.989268},{"k":"Cancha","lat":19.049102,"lng":-96.976029},{"k":"Policia","lat":19.052137,"lng":-96.985096},{"k":"Salon del Reino","lat":19.05112,"lng":-96.980288},{"k":"Palacio","lat":19.048968,"lng":-96.978928}];

const mapa = L.map('mapa', { zoomControl:true, center:[19.048889,-96.981944], zoom:15 });

/* Calles reales de OpenStreetMap por debajo de todo */
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(mapa);

const capaZonas = L.geoJSON(ZONAS, {
  style: f => ({
    color:f.properties.color,   // borde del mismo color
    weight:1.4,
    opacity:.9,
    fillColor:f.properties.color,
    fillOpacity:.40             // alto para que se vean las calles debajo
  })
}).addTo(mapa);

/* Numeros: pequenos, en el punto donde los marcaste */
const capaNumeros = L.layerGroup(NUMEROS.map(n => L.marker([n.lat, n.lng], {
  interactive:false,
  icon:L.divIcon({ className:'num-zona', html:'<span>'+n.n+'</span>', iconSize:[0,0], iconAnchor:[0,0] })
}))).addTo(mapa);

/* Lugares: tamano normal */
const INICIAL = { 'Iglesia':'I', 'Cancha':'C', 'Policia':'P', 'Salon del Reino':'S', 'Palacio':'G' };
L.layerGroup(LUGARES.map(l => L.marker([l.lat, l.lng], {
  title:l.k,
  icon:L.divIcon({ className:'icono-lugar', html:'<span>'+(INICIAL[l.k]||'R')+'</span>', iconSize:[0,0], iconAnchor:[0,0] })
}))).addTo(mapa);

mapa.fitBounds(capaZonas.getBounds(), { padding:[24,24] });

/* Leyenda y controles */
const leyenda = document.getElementById('leyenda');
ZONAS.features.slice().sort((a,b)=>a.properties.zona-b.properties.zona).forEach(f => {
  const fila = document.createElement('div');
  fila.className = 'fila';
  fila.innerHTML = '<span class="muestra" style="background:'+f.properties.color+'"></span>Zona '+f.properties.zona;
  leyenda.appendChild(fila);
});
document.getElementById('ver-zonas').addEventListener('change', e => {
  if(e.target.checked){ capaZonas.addTo(mapa); capaNumeros.addTo(mapa); }
  else { mapa.removeLayer(capaZonas); mapa.removeLayer(capaNumeros); }
});
document.getElementById('transparencia').addEventListener('input', e => {
  capaZonas.setStyle({ fillOpacity: Number(e.target.value)/100 });
});
